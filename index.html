<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#C9A84C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SunoPrep">
  <meta name="description" content="SunoPrep 9.3 - Advanced song preparation tool for Suno AI">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png">
  <title>SunoPrep 9.3</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0B0B0F; font-family: 'Segoe UI', Tahoma, sans-serif; }
    #root { min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"><div style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:#C9A84C;font-size:18px">⏳ Loading SunoPrep...</div></div>

  <script>
    // Storage shim: localStorage with in-memory fallback (works in preview + live site)
    window.__mem = {};
    window.localGet = async (key) => {
      try { const v = localStorage.getItem('sp_' + key); return v != null ? { value: v } : (window.__mem[key] != null ? { value: window.__mem[key] } : null); }
      catch { return window.__mem[key] != null ? { value: window.__mem[key] } : null; }
    };
    window.localSet = async (key, value) => {
      window.__mem[key] = value;
      try { localStorage.setItem('sp_' + key, value); } catch {}
      return { key, value };
    };
    // API key for Pro mode (stored in localStorage)
    window.getApiKey = () => localStorage.getItem('sp_api_key') || '';
    window.setApiKey = (k) => localStorage.setItem('sp_api_key', k);

    // Register Service Worker for PWA / offline
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <script type="text/babel" src="app.jsx"></script>

  <!-- ═══════════ עוזר AppNest ═══════════
       "המפה" של SunoPrep — מתארת למנוע העוזר את המסכים, השדות והרקע של
       האפליקציה הזו. המנוע עצמו (appnest-assistant.js) זהה בכל האפליקציות;
       רק המפה הזו משתנה לכל אפליקציה. -->
  <script>
    window.APPNEST_ASSISTANT_CONFIG = {
      appName: 'SunoPrep',
      aiConfigKey: 'sp_ai-config',
      appDescription:
        'SunoPrep הוא כלי להכנת שירים ל-Suno AI: כתיבת מילות שיר, תגיות מבנה ([Verse], [Chorus] וכו\'), ' +
        'המרת עברית לכתיב שסונו מבין, בחירת סגנון מוזיקלי וקול, ובנק משפטים ורעיונות. ' +
        'עזור למשתמש לכתוב שירים טובים, להבין את התכונות, ולמצוא את דרכו באפליקציה.',
      // מסכים שאפשר לנווט אליהם (הטקסט/אייקון שמופיע על הכפתור)
      tabs: [
        { name: 'כתיבה',    match: 'כתיבה' },
        { name: 'רעיונות',  match: 'רעיונות' },
        { name: 'קולות',    match: 'קולות' },
        { name: 'בדיקות',   match: 'בדיקות' },
        { name: 'פרויקטים', match: 'פרויקטים' },
        { name: 'Suno',     match: 'Suno' },
        { name: 'הגדרות',   match: '⚙' },
        { name: 'אודות',    match: 'ℹ️' }
      ],
      // שדות שאפשר לכתוב אליהם (מזוהים לפי הטקסט של ה-placeholder)
      fields: [
        { name: 'lyrics', label: 'שדה מילות השיר', placeholder: 'כתוב את מילות השיר כאן' },
        { name: 'style',  label: 'שדה הסגנון המותאם', placeholder: 'הוסף סגנון מותאם' }
      ]
    };
  </script>
  <script src="appnest-assistant.js"></script>
</body>
</html>
