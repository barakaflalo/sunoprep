<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#C9A84C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SunoPrep">
  <meta name="description" content="SunoPrep 9.3 - Advanced song preparation tool for Suno AI">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png">
  <title>SunoPrep 9.3</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0B0B0F; font-family: 'Segoe UI', Tahoma, sans-serif; }
    #root { min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"><div style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:#C9A84C;font-size:18px">⏳ Loading SunoPrep...</div></div>

  <script>
    // Storage shim: localStorage with in-memory fallback (works in preview + live site)
    window.__mem = {};
    window.localGet = async (key) => {
      try { const v = localStorage.getItem('sp_' + key); return v != null ? { value: v } : (window.__mem[key] != null ? { value: window.__mem[key] } : null); }
      catch { return window.__mem[key] != null ? { value: window.__mem[key] } : null; }
    };
    window.localSet = async (key, value) => {
      window.__mem[key] = value;
      try { localStorage.setItem('sp_' + key, value); } catch {}
      return { key, value };
    };
    // API key for Pro mode (stored in localStorage)
    window.getApiKey = () => localStorage.getItem('sp_api_key') || '';
    window.setApiKey = (k) => localStorage.setItem('sp_api_key', k);

    // Register Service Worker for PWA / offline
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <script type="text/babel" src="app.jsx"></script>

  <!-- ═══════════════ עוזר חכם (page-agent) — שכבת ניסוי ═══════════════
       שכבה נפרדת שלא נוגעת בקוד האפליקציה (app.jsx). קוראת את המפתח והספק
       שהמשתמש כבר חיבר (sp_ai-config), ומפעילה עליהם את page-agent.
       page-agent הוא MIT (חינמי, קוד פתוח). המפתח נשאר במכשיר. -->
  <script
    src="https://cdn.jsdelivr.net/npm/page-agent@1.12.2/dist/iife/page-agent.demo.js?autoInit=false"
    crossorigin="anonymous"></script>
  <script>
  (function () {
    // ── ממפה את הספק+המפתח שהמשתמש חיבר ב-SunoPrep לפורמט תואם-OpenAI ש-page-agent צריך ──
    function buildAgentConfig() {
      var raw;
      try { raw = localStorage.getItem('sp_ai-config'); } catch (e) { raw = null; }
      if (!raw) return { error: 'no-config' };
      var cfg; try { cfg = JSON.parse(raw); } catch (e) { return { error: 'bad-config' }; }
      var p = cfg.provider, k = cfg.keys || {};
      if (!p) return { error: 'no-provider' };

      // page-agent מדבר רק "פורמט OpenAI". לכל ספק — הכתובת התואמת-OpenAI שלו.
      if (p === 'openai')
        return { model: 'gpt-4o-mini', baseURL: 'https://api.openai.com/v1', apiKey: k.openai || '' };
      if (p === 'gemini')
        return { model: 'gemini-2.5-flash',
                 baseURL: 'https://generativelanguage.googleapis.com/v1beta/openai',
                 apiKey: k.gemini || '' };
      if (p === 'device')
        return { model: 'llama3',
                 baseURL: (k.deviceUrl || '').replace(/\/+$/, ''), apiKey: '' };
      if (p === 'custom')
        return { model: 'gpt-4o-mini',
                 baseURL: (k.customUrl || '').replace(/\/(chat\/completions)?\/*$/, ''),
                 apiKey: k.customKey || '' };
      if (p === 'claude')
        return { model: 'claude-sonnet-4-6', baseURL: 'https://api.anthropic.com/v1',
                 apiKey: k.claude || '',
                 // Claude דורש header מיוחד לקריאה ישירה מהדפדפן
                 customFetch: function (url, opts) {
                   opts = opts || {}; opts.headers = opts.headers || {};
                   opts.headers['anthropic-dangerous-direct-browser-access'] = 'true';
                   return fetch(url, opts);
                 } };
      return { error: 'unknown-provider', provider: p };
    }

    var agent = null;
    function launchAgent() {
      if (agent) { agent.panel.show(); return; }
      if (!window.PageAgent) { alert('העוזר עדיין נטען, נסה שוב עוד רגע.'); return; }
      var conf = buildAgentConfig();
      if (conf.error) {
        alert('כדי להשתמש בעוזר, חבר קודם מפתח AI בהגדרות הבינה של האפליקציה. (' + conf.error + ')');
        return;
      }
      try {
        agent = new window.PageAgent({ model: conf.model, baseURL: conf.baseURL,
          apiKey: conf.apiKey, customFetch: conf.customFetch, language: 'en-US' });
        agent.panel.show();
      } catch (e) {
        alert('שגיאה בהפעלת העוזר: ' + (e && e.message ? e.message : e));
      }
    }

    // ── כפתור צף להפעלת העוזר ──
    function addButton() {
      if (document.getElementById('pa-launch')) return;
      var b = document.createElement('button');
      b.id = 'pa-launch';
      b.textContent = '🪄 עוזר';
      b.style.cssText = 'position:fixed;bottom:16px;left:16px;z-index:99999;' +
        'background:#C9A84C;color:#0B0B0F;border:none;border-radius:24px;' +
        'padding:10px 18px;font:600 15px/1 "Segoe UI",sans-serif;cursor:pointer;' +
        'box-shadow:0 4px 16px rgba(0,0,0,.4);';
      b.onclick = launchAgent;
      document.body.appendChild(b);
    }
    if (document.readyState === 'loading')
      document.addEventListener('DOMContentLoaded', addButton);
    else addButton();
  })();
  </script>
</body>
</html>
